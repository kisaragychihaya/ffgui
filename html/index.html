<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="home.title">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>FFGui - 音视频工具箱</title>
  <link rel="icon" href="../assets/imgs/icon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 功能导航首页 -->
  <main id="home-view" class="view">
    <header class="hero">
      <h1 data-i18n="home.heroTitle">音视频工具箱</h1>
      <p class="subtitle" data-i18n="home.heroSubtitle">选择下方功能开始处理你的音视频文件</p>
    </header>

    <section class="card-grid">
      <button class="feature-card" data-feature="convert">
        <span class="card-icon icon-convert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h13l-3-3" />
            <path d="M20 17H7l3 3" />
            <rect x="3" y="10" width="18" height="4" rx="1" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardConvertTitle">音视频转码</span>
        <span class="card-desc" data-i18n="home.cardConvertDesc">在 MP4 / MKV / MP3 等格式之间互相转换</span>
      </button>

      <button class="feature-card" data-feature="merge">
        <span class="card-icon icon-merge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6H4v12h4" />
            <path d="M16 6h4v12h-4" />
            <path d="M8 12h8" />
            <path d="M12 9v6" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardMergeTitle">音视频合并</span>
        <span class="card-desc" data-i18n="home.cardMergeDesc">将多个音视频片段拼接为一个文件</span>
      </button>

      <button class="feature-card" data-feature="clip">
        <span class="card-icon icon-clip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.5" />
            <circle cx="6" cy="18" r="2.5" />
            <path d="M8 7.5 20 19" />
            <path d="M8 16.5 20 5" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardClipTitle">音视频截取</span>
        <span class="card-desc" data-i18n="home.cardClipDesc">按时间段裁剪出需要的音视频部分</span>
      </button>

      <button class="feature-card" data-feature="crop">
        <span class="card-icon icon-crop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3v13a2 2 0 0 0 2 2h13" />
            <path d="M3 6h13a2 2 0 0 1 2 2v13" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardCropTitle">画面裁剪</span>
        <span class="card-desc" data-i18n="home.cardCropDesc">在视频画面上框选区域，裁剪输出 MP4</span>
      </button>

      <button class="feature-card" data-feature="record">
        <span class="card-icon icon-record">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" />
            <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardRecordTitle">屏幕录制</span>
        <span class="card-desc" data-i18n="home.cardRecordDesc">录制屏幕或窗口画面，可选系统声音与麦克风</span>
      </button>

      <button class="feature-card" data-feature="disc">
        <span class="card-icon icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" />
            <circle cx="12" cy="12" r="2.5" />
            <path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" opacity="0.6" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardDiscTitle">光盘抓取</span>
        <span class="card-desc" data-i18n="home.cardDiscDesc">从 DVD / 蓝光光盘抓取标题并转码输出</span>
      </button>

      <button class="feature-card" data-feature="dub">
        <span class="card-icon icon-dub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5v-3.5H6a2.5 2.5 0 0 1-2.5-2.5V6A2.5 2.5 0 0 1 6 3.5h11.5A2.5 2.5 0 0 1 20 6z" />
            <path d="M8 8.5v3" />
            <path d="M11 7v6" />
            <path d="M14 8.5v3" />
          </svg>
        </span>
        <span class="card-title" data-i18n="home.cardDubTitle">字幕配音</span>
        <span class="card-desc" data-i18n="home.cardDubDesc">将字幕文本合成为语音，作为新音轨混入视频</span>
      </button>
    </section>

    <footer class="footer">
      <span>Powered by FFmpeg</span>
      <button id="btn-clear-cache" class="btn-clear-cache" type="button"
              data-i18n="home.clearCache" data-i18n-attr="title:home.clearCacheTip"
              title="删除 ffmpeg 能力探测缓存（硬件加速 / 编码器），下次进入转码页时重新检测">
        清除硬件信息缓存
      </button>
    </footer>
  </main>

  <!-- 功能页占位（后续替换为真正的功能页面） -->
  <main id="feature-view" class="view hidden">
    <header class="feature-header">
      <button id="btn-back" class="btn-back" type="button" data-i18n="common.backHome">← 返回首页</button>
      <h2 id="feature-title"></h2>
    </header>
    <section class="feature-placeholder">
      <p><span data-i18n="home.featureSoonOpen">「</span><span id="feature-name"></span><span data-i18n="home.featureSoonClose">」功能开发中，敬请期待。</span></p>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
