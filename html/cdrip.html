<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="cd.title">
<head>
  <meta charset="UTF-8" />
  <!-- 本页不预览任何本地媒体，故不放行 media-src / img-src -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>CD 抓轨 - FFGui</title>
  <link rel="icon" href="../assets/imgs/icon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cd.css" />
</head>
<body>
  <main class="view cd-view">
    <header class="feature-header">
      <button id="btn-back" class="btn-back" type="button" data-i18n="common.backHome">← 返回首页</button>
      <h2 data-i18n="cd.heading">CD 抓轨</h2>
    </header>

    <!-- 来源：物理光驱（libcdio 读取音乐 CD） -->
    <section class="panel" id="source-panel">
      <div class="panel-header">
        <h3 data-i18n="cd.secSource">光盘来源</h3>
        <div class="panel-actions">
          <button id="btn-probe" class="btn btn-primary" type="button" data-i18n="cd.btnProbe" disabled>读取光盘</button>
        </div>
      </div>
      <div class="cd-source-row">
        <span id="drive-wrap" class="cd-drive">
          <label for="sel-drive" data-i18n="cd.lblDrive">光驱</label>
          <select id="sel-drive" disabled></select>
        </span>
        <button id="btn-refresh-drives" class="btn" type="button" data-i18n="cd.btnRefreshDrives">刷新光驱</button>
      </div>
      <p id="drive-hint" class="caps-info">正在枚举光驱…</p>
      <p class="caps-info" data-i18n="cd.hintSourceSupport">读取音乐 CD（音频 CD，非 DVD / 蓝光）。读取过程中请保持光盘在位，抓取的是未经压缩的 44.1 kHz / 16 bit 音质，编码为 FLAC 无损格式。</p>
    </section>

    <!-- 曲目列表 -->
    <section class="panel hidden" id="tracks-panel">
      <div class="panel-header">
        <h3 data-i18n="cd.secTracks">曲目列表</h3>
        <div class="panel-actions">
          <button id="btn-lookup" class="btn" type="button" data-i18n="cd.btnLookup" disabled>查询专辑信息</button>
        </div>
      </div>
      <div id="cd-meta" class="cd-meta"></div>
      <div id="mb-result" class="cd-mb hidden"></div>
      <ul id="track-list" class="cd-track-list"></ul>
      <p class="caps-info" data-i18n="cd.hintTracks">默认勾选全部曲目。可单独填写每首的曲名与演唱者，也可点「查询专辑信息」从 MusicBrainz 自动填充（需要联网）。</p>
    </section>

    <!-- 专辑信息 -->
    <section class="panel hidden" id="meta-panel">
      <div class="panel-header"><h3 data-i18n="cd.secMeta">专辑信息</h3></div>
      <div class="form-grid settings-grid">
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblAlbum">专辑名</span>
          <input id="input-album" type="text" maxlength="300" placeholder="未填写" data-i18n-attr="placeholder:cd.phAlbum" />
        </label>
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblAlbumArtist">专辑艺人</span>
          <input id="input-album-artist" type="text" maxlength="300" placeholder="未填写" data-i18n-attr="placeholder:cd.phArtist" />
        </label>
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblArtist">默认演唱者</span>
          <input id="input-artist" type="text" maxlength="300" placeholder="未填写" data-i18n-attr="placeholder:cd.phArtist" />
        </label>
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblDate">发行日期</span>
          <input id="input-date" type="text" maxlength="300" placeholder="如 2024 或 2024-05-01" data-i18n-attr="placeholder:cd.phDate" />
        </label>
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblGenre">流派</span>
          <input id="input-genre" type="text" maxlength="300" placeholder="未填写" data-i18n-attr="placeholder:cd.phGenre" />
        </label>
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblCompression">压缩级别</span>
          <select id="sel-compression">
            <option value="5" data-i18n="cd.compressionFast">较快（5）</option>
            <option value="8" selected data-i18n="cd.compressionBalanced">均衡（8，推荐）</option>
            <option value="12" data-i18n="cd.compressionSmallest">最小体积（12）</option>
          </select>
        </label>
      </div>
      <p class="caps-info" data-i18n="cd.hintCompression">FLAC 是无损格式，压缩级别只影响文件大小与耗时，不影响音质。</p>
    </section>

    <!-- 输出设置 -->
    <section class="panel hidden" id="output-panel">
      <div class="panel-header"><h3 data-i18n="cd.secOutput">输出设置</h3></div>
      <div class="form-grid settings-grid">
        <label class="form-item">
          <span class="form-label" data-i18n="cd.lblParanoia">纠错强度</span>
          <select id="sel-paranoia">
            <option value="disable" selected data-i18n="cd.paranoiaDisable">关闭（最快，适合新盘）</option>
            <option value="verify" data-i18n="cd.paranoiaVerify">校验重叠区</option>
            <option value="overlap" data-i18n="cd.paranoiaOverlap">重叠读取</option>
            <option value="neverskip" data-i18n="cd.paranoiaNeverSkip">绝不跳过（最稳，很慢）</option>
            <option value="full" data-i18n="cd.paranoiaFull">完整纠错（最慢，适合旧盘）</option>
          </select>
        </label>
        <label class="form-item form-item-dir">
          <span class="form-label" data-i18n="cd.lblOutputDir">输出目录</span>
          <span class="dir-picker">
            <input id="input-outdir" type="text" readonly placeholder="请选择输出目录" data-i18n-attr="placeholder:cd.phOutputDir" />
            <button id="btn-pick-dir" class="btn" type="button" data-i18n="cd.btnBrowse">浏览…</button>
          </span>
        </label>
      </div>
      <p class="caps-info" data-i18n="cd.hintOutput">文件名为「专辑名 - 曲序.flac」。已有同名文件时自动追加编号，不会覆盖。</p>
    </section>

    <!-- 进度与操作 -->
    <section class="panel hidden" id="action-panel">
      <div class="convert-actions">
        <button id="btn-start" class="btn btn-primary" type="button" data-i18n="cd.btnStart" disabled>开始抓取</button>
        <button id="btn-cancel" class="btn btn-danger hidden" type="button" data-i18n="common.cancel">取消</button>
        <span id="status-text" class="status-text"></span>
      </div>
      <p id="start-hint" class="caps-info"></p>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <pre id="log-area" class="log-area hidden"></pre>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cd.js"></script>
</body>
</html>
