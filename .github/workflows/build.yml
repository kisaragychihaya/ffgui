name: 打包产物

on:
  # 手动触发（Actions 页面 → 打包产物 → Run workflow）
  workflow_dispatch:
  # 发布 Release 时触发
  release:
    types: [published]

# Release 触发时上传产物到 Release Assets 需要写权限
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # native/qwentts.cpp（TTS 引擎）内部还套着 ggml 子模块，必须递归检出，
          # 否则 scripts/build-tts.cjs 的 cmake 配置会因缺 ggml/ 直接失败
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建光盘侧车
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native/ffgui-disc/Cargo.toml
          New-Item -ItemType Directory -Force bin/disc | Out-Null
          Copy-Item native/ffgui-disc/target/release/ffgui-disc.exe bin/disc/ffgui-disc.exe

      # Vulkan SDK 是 Vulkan 后端的硬前置：ggml 的 ggml-vulkan 目标要求 glslc 与
      # SPIRV-Headers，并通过 VULKAN_SDK 环境变量定位（该 action 会写入 GITHUB_ENV）。
      # 未验证：action 版本与输入名以此处写法为准，若上游改名需同步调整
      - name: 安装 Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.290.0
          cache: true

      # TTS 引擎（字幕配音）：Vulkan 为主力后端，构建失败时回退 CPU 版并继续打包；
      # 两者都失败只写警告并建空 bin/tts/，不阻断打包（字幕配音在运行时回退 PATH 查找）
      - name: 构建 TTS 引擎 tts-server
        shell: pwsh
        run: |
          # --no-native：runner 的 CPU 可能带 AVX512 等扩展，-march=native 会让产物
          # 在用户机器上报非法指令，分发用构建必须关掉宿主优化
          node scripts/build-tts.cjs --backend vulkan --no-native
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Vulkan 版 tts-server 构建失败，回退 CPU 后端'
            node scripts/build-tts.cjs --backend cpu --no-native --clean
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'CPU 版 tts-server 也构建失败，本次打包不含 TTS 引擎（字幕配音回退 PATH 查找）'
            New-Item -ItemType Directory -Force bin/tts | Out-Null
          }
          if (Test-Path bin/tts/tts-server.exe) {
            Get-Item bin/tts/tts-server.exe | Select-Object FullName, Length
          }
          # GitHub 的 pwsh 包装会在脚本末尾按 $LASTEXITCODE 退出，这里显式归零，
          # 否则"构建失败但继续打包"会被当成步骤失败（真正的错误已由 Write-Warning 记录）
          exit 0

      - name: 下载 ffmpeg 并放入 bin/
        shell: pwsh
        run: |
          # gyan.dev 直链在 CI 上会被反爬拦截（GET 返回 HTML 而非压缩包），
          # 改走其官方 GitHub 镜像 GyanD/codexffmpeg 的最新 release
          $headers = @{ Authorization = 'Bearer ${{ secrets.GITHUB_TOKEN }}' }
          $rel = Invoke-RestMethod 'https://api.github.com/repos/GyanD/codexffmpeg/releases/latest' -Headers $headers
          if ($rel.message) { throw "GitHub API 返回错误：$($rel.message)" }
          $asset = $rel.assets | Where-Object { $_.name -match 'full_build\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw 'codexffmpeg 最新 release 中未找到 full_build.7z' }
          Write-Host "下载 $($asset.name)"
          # 解压到临时目录再取 bin/ffmpeg.exe：在仓库根目录解压会留下
          # ffmpeg-<版本>-full_build/ 残留（含 ffplay/ffprobe/doc 约 860MB），
          # 会被打进 app.asar（forge.config.js 的 ignore 虽已排除，仍从源头避免）
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          curl.exe -L -o "$tmp\ffmpeg.7z" $asset.browser_download_url
          7z x "$tmp\ffmpeg.7z" -o"$tmp" | Out-Null
          $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe -Path $tmp |
            Where-Object { $_.FullName -like '*bin*' } | Select-Object -First 1
          if (-not $exe) { throw '压缩包中未找到 ffmpeg.exe' }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item $exe.FullName bin/ffmpeg.exe
          # PowerShell 执行相对路径程序必须带 .\
          .\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: 下载 aria2c 并放入 bin/aria2
        shell: pwsh
        run: |
          # aria2 官方 Release 只有 Windows 64 位构建（无 Windows arm64 / macOS 版），
          # 因此只在本 job 内置 aria2c.exe；arm64 与 macOS 运行时靠 PATH 探测，
          # 都没有时 main/dub.js 回退内置 https 下载（模型下载仍可用，只是不能断点续传）
          $url = 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip'
          # 解压到 $RUNNER_TEMP，避免往仓库根目录留大目录（forge.config.js 的 ignore 虽已
          # 排除 bin/，仍从源头避免残留）
          $tmp = Join-Path $env:RUNNER_TEMP 'aria2-extract'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          curl.exe -L --fail -o "$tmp\aria2.zip" $url
          if ($LASTEXITCODE -ne 0) { throw '下载 aria2 release 压缩包失败' }
          7z x "$tmp\aria2.zip" -o"$tmp" | Out-Null
          $exe = Get-ChildItem -Recurse -Filter aria2c.exe -Path $tmp | Select-Object -First 1
          if (-not $exe) { throw '压缩包中未找到 aria2c.exe' }
          New-Item -ItemType Directory -Force bin/aria2 | Out-Null
          Copy-Item $exe.FullName bin/aria2/aria2c.exe
          .\bin\aria2\aria2c.exe --version | Select-Object -First 1

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run package

      - name: 生成 NSIS 安装包
        run: node scripts/build-installer.cjs --app-dir out/FFGui-win32-x64 --arch x64

      # 安装包冒烟测试：静默装到临时目录，确认「装完东西还在」。
      # 卸载段若被写成非字面量 "Uninstall" 的段名，NSIS 会把它当普通安装段在装完后立刻执行，
      # 文件/快捷方式/卸载项被删光而退出码仍是 0 —— 只有真装一次才能发现。
      - name: 安装包冒烟测试（安装 → 校验快捷方式与文件 → 卸载）
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/make -Recurse -Filter 'FFGui-*-x64-Setup.exe' |
            Select-Object -First 1
          if (-not $setup) { throw '未找到 x64 安装包' }
          $dir = Join-Path $env:RUNNER_TEMP 'ffgui-smoke'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安装程序退出码 $($p.ExitCode)" }

          foreach ($f in @('FFGui.exe', 'uninstall.exe', 'resources\app.asar')) {
            if (-not (Test-Path (Join-Path $dir $f))) {
              throw "安装后缺少 $f —— 卸载段可能被当成安装段执行了"
            }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) '狒狒格式工具箱.lnk'
          if (-not (Test-Path $lnk)) { throw "未创建桌面快捷方式：$lnk" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\狒狒格式工具箱'
          if (-not (Test-Path $menu)) { throw "未创建开始菜单目录：$menu" }
          if ((Get-ChildItem $menu -Filter *.lnk).Count -lt 2) { throw '开始菜单缺少主程序/卸载快捷方式' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ffgui' -ErrorAction SilentlyContinue)) {
            throw '未写入卸载注册表项'
          }
          Write-Host '安装阶段校验通过'

          # 卸载器会把自己复制到临时目录再执行，-Wait 可能提前返回，故轮询等待
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'FFGui.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'FFGui.exe')) { throw '卸载后仍残留安装目录' }
          if (Test-Path $lnk) { throw '卸载后仍残留桌面快捷方式' }
          Write-Host '安装包冒烟测试通过'

      - name: 压缩产物
        shell: pwsh
        run: 7z a FFGui-windows-x64.7z ./out/FFGui-win32-x64 | Out-Null

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FFGui-windows-x64
          path: FFGui-windows-x64.7z

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: FFGui-windows-x64-Setup
          path: out/make/**/FFGui-*-Setup.exe

      - name: 上传到 Release（仅 Release 触发时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FFGui-windows-x64.7z
            out/make/**/FFGui-*-Setup.exe

  windows-arm64:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # native/qwentts.cpp（TTS 引擎）内部还套着 ggml 子模块，必须递归检出，
          # 否则 scripts/build-tts.cjs 的 cmake 配置会因缺 ggml/ 直接失败
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust（含 ARM64 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: 配置 MSVC ARM64 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: 准备 clang（ring ARM64 汇编）
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvmBin = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path "$llvmBin\clang.exe")) {
              choco install llvm -y --no-progress
            }
            if (-not (Test-Path "$llvmBin\clang.exe")) { throw '未找到 clang，无法构建 ring ARM64' }
            $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$llvmBin;$env:PATH"
          }
          clang --version

      - name: 指定 MSVC ARM64 链接器
        shell: pwsh
        run: |
          # Git for Windows 自带 /usr/bin/link.exe，会遮蔽 MSVC 链接器；
          # 交叉链接必须显式指向 Hostx64\arm64\link.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw '未找到 Visual Studio' }
          $toolset = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw '未找到 MSVC 工具集' }
          $linker = Join-Path $toolset.FullName 'bin\Hostx64\arm64\link.exe'
          if (-not (Test-Path $linker)) { throw "未找到 ARM64 链接器：$linker" }
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ARM64 linker: $linker"

      - name: 构建 ARM64 光盘侧车
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native/ffgui-disc/Cargo.toml --target aarch64-pc-windows-msvc
          New-Item -ItemType Directory -Force bin/disc | Out-Null
          Copy-Item native/ffgui-disc/target/aarch64-pc-windows-msvc/release/ffgui-disc.exe bin/disc/ffgui-disc.exe
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\bin\disc\ffgui-disc.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw ('bin/disc/ffgui-disc.exe 不是 ARM64 二进制 (machine=0x{0:X4})' -f $machine) }
          Write-Host 'ffgui-disc.exe 机器类型校验通过：ARM64'

      # ARM64 只做 CPU 后端：Vulkan 交叉构建的工具链（glslc/SPIRV-Headers + arm64 链接）不稳。
      # 未验证：-A ARM64 依赖 runner 装好 MSVC ARM64 工具集（现有 cargo/ffmpeg 步骤已依赖它）。
      # 构建失败不阻断打包，但建出空 bin/tts/（避免 extraResource 指向不存在的路径）
      - name: 构建 ARM64 TTS 引擎 tts-server（仅 CPU）
        shell: pwsh
        run: |
          node scripts/build-tts.cjs --backend cpu --arch arm64 --no-native
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'ARM64 版 tts-server 构建失败，本次打包不含 TTS 引擎（字幕配音回退 PATH 查找）'
            New-Item -ItemType Directory -Force bin/tts | Out-Null
          }
          if (Test-Path bin/tts/tts-server.exe) {
            # runner 是 x64，无法执行 arm64 二进制，改为校验 PE 头机器类型（0xAA64 = ARM64）
            $bytes = [System.IO.File]::ReadAllBytes("$PWD\bin\tts\tts-server.exe")
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) { throw ('bin/tts/tts-server.exe 不是 ARM64 二进制 (machine=0x{0:X4})' -f $machine) }
            Write-Host 'tts-server.exe 机器类型校验通过：ARM64'
          }
          # 同 x64：构建失败不阻断打包，显式归零 $LASTEXITCODE（真正的错误已记录为警告）
          exit 0

      # aria2 官方没有 Windows arm64 构建，上游也没有可白嫖的 arm64 资产（见下面步骤）：
      # 走「官方 x64 构建 + Windows 11 ARM 系统模拟」，失败只警告不阻断（运行时回退
      # PATH 探测与内置 https）。ffmpeg 则有真正的 arm64 社区构建。
      - name: 下载 ARM64 版 ffmpeg 并放入 bin/
        shell: pwsh
        run: |
          # Windows ARM64 构建来自 tordona/ffmpeg-win-arm64（gyan.dev 无 arm64 构建），
          # 取最新 release 的 full static 包（与 x64 的 full_build 能力对齐）
          $headers = @{ Authorization = 'Bearer ${{ secrets.GITHUB_TOKEN }}' }
          $rel = Invoke-RestMethod 'https://api.github.com/repos/tordona/ffmpeg-win-arm64/releases/latest' -Headers $headers
          if ($rel.message) { throw "GitHub API 返回错误：$($rel.message)" }
          $asset = $rel.assets | Where-Object { $_.name -match 'full-static-win-arm64\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw 'ffmpeg-win-arm64 最新 release 中未找到 full-static-win-arm64.7z' }
          Write-Host "下载 $($asset.name)"
          # 解压到临时目录再取 bin/ffmpeg.exe：在仓库根目录解压会留下
          # ffmpeg-<版本> 残留目录（含 ffplay/ffprobe/doc，约 860MB），
          # 会被打进 app.asar（forge.config.js 的 ignore 虽已排除，仍从源头避免）
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64-extract'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          curl.exe -L -o "$tmp\ffmpeg.7z" $asset.browser_download_url
          7z x "$tmp\ffmpeg.7z" -o"$tmp" | Out-Null
          $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe -Path $tmp |
            Where-Object { $_.FullName -like '*bin*' } | Select-Object -First 1
          if (-not $exe) { throw '压缩包中未找到 ffmpeg.exe' }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item $exe.FullName bin/ffmpeg.exe
          # runner 是 x64，无法执行 arm64 二进制，改为校验 PE 头机器类型（0xAA64 = ARM64）
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\bin\ffmpeg.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw ('bin/ffmpeg.exe 不是 ARM64 二进制 (machine=0x{0:X4})' -f $machine) }
          Write-Host 'ffmpeg.exe 机器类型校验通过：ARM64'

      # 内置 aria2c（WOA）。aria2 官方只发 win-64bit 构建，abcfy2/aria2-static-build 也
      # 只在 ubuntu 上交叉编 linux-musl 与 x86_64/i686 mingw —— 先探一次上游有没有 arm64
      # 资产（哪天加上了就能直接白嫖），没有就退回官方 x64 构建：Windows 11 ARM 会用
      # 系统模拟执行它，下载是 I/O 密集型，模拟开销可忽略；这与 winget/choco 里的 aria2
      # 在 WOA 上的实际形态一致（社区也没有原生 arm64 版）。
      # 失败只警告：缺 bin/aria2 时 forge 自动跳过，运行时回退 PATH 探测与内置 https。
      - name: 内置 aria2c 并放入 bin/aria2
        shell: pwsh
        run: |
          try {
            $url = ''
            try {
              $headers = @{ Authorization = 'Bearer ${{ secrets.GITHUB_TOKEN }}' }
              $rel = Invoke-RestMethod 'https://api.github.com/repos/abcfy2/aria2-static-build/releases/tags/1.37.0' -Headers $headers
              $asset = $rel.assets |
                Where-Object { $_.name -match 'aarch64.*(w64-mingw32|windows|woa)' } |
                Select-Object -First 1
              if ($asset) {
                $url = $asset.browser_download_url
                Write-Host "上游有 arm64 资产：$($asset.name)"
              }
            } catch {
              Write-Warning "查询 abcfy2/aria2-static-build 资产失败：$($_.Exception.Message)"
            }
            if (-not $url) {
              Write-Host '上游没有 Windows arm64 资产，改用官方 x64 构建（Win11 ARM 系统模拟）'
              $url = 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip'
            }
            # 解压到 $RUNNER_TEMP，不在仓库根目录留残留
            $tmp = Join-Path $env:RUNNER_TEMP 'aria2-arm64-extract'
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $tmp | Out-Null
            curl.exe -L --fail -o "$tmp\aria2.zip" $url
            if ($LASTEXITCODE -ne 0) { throw '下载 aria2 压缩包失败' }
            7z x "$tmp\aria2.zip" -o"$tmp" | Out-Null
            $exe = Get-ChildItem -Recurse -Filter aria2c.exe -Path $tmp | Select-Object -First 1
            if (-not $exe) { throw '压缩包中未找到 aria2c.exe' }
            New-Item -ItemType Directory -Force bin/aria2 | Out-Null
            Copy-Item $exe.FullName bin/aria2/aria2c.exe
            # runner 是 x64：arm64 资产只能校验 PE 头；官方 x64 资产可在这里直接跑
            $bytes = [System.IO.File]::ReadAllBytes("$PWD\bin\aria2\aria2c.exe")
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -eq 0xAA64) {
              Write-Host 'aria2c.exe 机器类型校验通过：ARM64'
            } elseif ($machine -eq 0x8664) {
              Write-Host 'aria2c.exe 为 x64 构建：Windows 11 ARM 通过系统模拟执行（aria2 无官方 arm64 构建）'
              .\bin\aria2\aria2c.exe --version | Select-Object -First 1
            } else {
              throw ('aria2c.exe 机器类型异常 (machine=0x{0:X4})' -f $machine)
            }
          } catch {
            Write-Warning "内置 aria2c 失败：$($_.Exception.Message)"
            Write-Warning '本次打包不含 aria2c（模型下载回退 PATH 探测与内置 https）'
            Remove-Item -Recurse -Force bin/aria2 -ErrorAction SilentlyContinue
          }
          exit 0

      - name: 安装依赖
        run: npm ci

      - name: 打包（arm64）
        run: npm run package -- --arch=arm64

      - name: 生成 NSIS 安装包
        run: node scripts/build-installer.cjs --app-dir out/FFGui-win32-arm64 --arch arm64

      - name: 压缩产物
        shell: pwsh
        run: 7z a FFGui-windows-arm64.7z ./out/FFGui-win32-arm64 | Out-Null

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FFGui-windows-arm64
          path: FFGui-windows-arm64.7z

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: FFGui-windows-arm64-Setup
          path: out/make/**/FFGui-*-Setup.exe

      - name: 上传到 Release（仅 Release 触发时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FFGui-windows-arm64.7z
            out/make/**/FFGui-*-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # native/qwentts.cpp（TTS 引擎）内部还套着 ggml 子模块，必须递归检出，
          # 否则 scripts/build-tts.cjs 的 cmake 配置会因缺 ggml/ 直接失败
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建光盘侧车
        run: |
          set -e
          cargo build --locked --release --manifest-path native/ffgui-disc/Cargo.toml
          mkdir -p bin/disc
          cp native/ffgui-disc/target/release/ffgui-disc bin/disc/ffgui-disc
          chmod +x bin/disc/ffgui-disc

      - name: 下载预编译 ffmpeg 并放入 bin/
        run: |
          set -e
          # 自建 macOS ffmpeg（kisaragychihaya/ffmpeg_build_mac 最新 release 的
          # static 混合静态构建，体积更小，能力与 shared 一致）：
          # tar.gz 内含 bin/(ffmpeg/ffprobe/ffplay) + lib/(无 .a 的库经
          # dylibbundler 收集，二进制引用 @executable_path/../lib)，
          # bin/ 与 lib/ 相对布局不能变，因此两个目录原样放入项目 bin/ 下
          # （bin/bin/ffmpeg + bin/lib/）
          # 匿名调用 api.github.com 在 runner 共享出口 IP 下易触发限流（返回无 assets
          # 的错误对象，被误判成"未找到资产"），带 GITHUB_TOKEN 换取更高配额，
          # 并让 API 错误信息直接暴露出来
          url=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/kisaragychihaya/ffmpeg_build_mac/releases/latest \
            | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));if(r.message){console.error('GitHub API 错误：'+r.message);process.exit(1)}const a=(r.assets||[]).find(x=>/macos-arm64-static\.tar\.gz$/.test(x.name));process.stdout.write(a?a.browser_download_url:'')")
          if [ -z "$url" ]; then echo 'ffmpeg_build_mac 最新 release 中未找到 macos-arm64-static tar.gz'; exit 1; fi
          echo "下载 $url"
          curl -L -o ffmac.tar.gz "$url"
          # 解压到临时目录再取 bin/ lib/：留在仓库根会被打进 app.asar
          rm -rf ffmac && mkdir -p ffmac
          tar xzf ffmac.tar.gz -C ffmac
          mkdir -p bin
          cp -R ffmac/bin ffmac/lib bin/
          rm -rf ffmac ffmac.tar.gz
          chmod +x bin/bin/ffmpeg
          ./bin/bin/ffmpeg -version | head -1

      # aria2c 官方没有 macOS 构建（abcfy2/aria2-static-build 也只出 linux-musl 与
      # mingw），因此在 runner 上原生编译：release tarball 自带 configure，唯一外部
      # 依赖是 brew 的静态 OpenSSL，其余特性（bittorrent/metalink/ssh2/sqlite/gmp/c-ares）
      # 全关——我们只用它的 HTTPS + HTTP Range 下载。
      # 任何一步失败都只打警告：打包继续，运行时 detectAria2 回退 PATH 探测与内置 https。
      - name: 编译 aria2c 并放入 bin/aria2
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -u
          BUILD="$RUNNER_TEMP/aria2-build"
          rm -rf "$BUILD" bin/aria2
          mkdir -p "$BUILD"
          if (
            set -e
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            # 只放 .a 的暂存目录：LDFLAGS 里排在 brew 的 -L 之前，-lssl/-lcrypto 才会
            # 命中静态库（brew 同时提供 .dylib，链接器默认优先动态库）
            mkdir -p "$BUILD/static"
            cp "$OPENSSL_PREFIX/lib/libssl.a" "$OPENSSL_PREFIX/lib/libcrypto.a" "$BUILD/static/"
            curl -L --fail --retry 3 -o "$BUILD/aria2.tar.gz" \
              https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.gz
            tar xzf "$BUILD/aria2.tar.gz" -C "$BUILD"
            cd "$BUILD/aria2-1.37.0"
            # TLS 用静态 OpenSSL，CA 包用 macOS 自带的 /etc/ssl/cert.pem（OpenSSL 不读
            # 系统钥匙串，必须把默认 CA 路径编进去，否则 --check-certificate 必失败）
            ./configure \
              --prefix="$BUILD/install" \
              --with-openssl --without-gnutls --without-appletls --without-wintls \
              --without-libgcrypt --without-libnettle \
              --without-libssh2 --without-libxml2 --without-libexpat \
              --without-sqlite3 --without-libgmp --without-libcares --without-libuv \
              --with-libz \
              --disable-bittorrent --disable-metalink --disable-websocket --disable-nls \
              --enable-static --disable-shared \
              --with-ca-bundle=/etc/ssl/cert.pem \
              ARIA2_STATIC=yes \
              PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" \
              CPPFLAGS="-I$OPENSSL_PREFIX/include" \
              LDFLAGS="-L$BUILD/static -L$OPENSSL_PREFIX/lib"
            make -j"$(sysctl -n hw.ncpu)"
            ARIA2C=src/aria2c
            if [ -x src/.libs/aria2c ]; then ARIA2C=src/.libs/aria2c; fi
            # 不能依赖 Homebrew 动态库：用户机器上没有 brew
            if ! file "$ARIA2C" | grep -q 'Mach-O'; then
              echo "构建产物不是 Mach-O 可执行文件：$(file "$ARIA2C")"
              exit 1
            fi
            if otool -L "$ARIA2C" | grep -qE '/(opt|usr/local)/'; then
              echo 'aria2c 仍依赖 Homebrew 动态库，放弃内置：'
              otool -L "$ARIA2C"
              exit 1
            fi
            "$ARIA2C" --version | head -1
            mkdir -p "$GITHUB_WORKSPACE/bin/aria2"
            cp "$ARIA2C" "$GITHUB_WORKSPACE/bin/aria2/aria2c"
            chmod +x "$GITHUB_WORKSPACE/bin/aria2/aria2c"
          ); then
            ls -l bin/aria2/
          else
            echo '警告：aria2c 编译失败，本次打包不含内置 aria2c（模型下载回退 PATH 探测与内置 https）'
            rm -rf bin/aria2
          fi

      # macOS 只做 CPU 后端（Metal 由 ggml 在 APPLE 下默认开启，Vulkan/MoltenVK 暂不涉及）。
      # cmake 在 runner 上已预装；构建失败不阻断打包，但要建出 bin/tts/
      - name: 构建 TTS 引擎 tts-server（仅 CPU）
        run: |
          set -e
          if ! node scripts/build-tts.cjs --backend cpu --no-native; then
            echo '警告：tts-server 构建失败，本次打包不含 TTS 引擎（字幕配音回退 PATH 查找）'
            mkdir -p bin/tts
          fi
          ls -l bin/tts/

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run package

      - name: 压缩产物
        run: ditto -c -k --sequesterRsrc --keepParent out/FFGui-darwin-arm64/FFGui.app FFGui-macos-arm64.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FFGui-macos-arm64
          path: FFGui-macos-arm64.zip

      - name: 上传到 Release（仅 Release 触发时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: FFGui-macos-arm64.zip
