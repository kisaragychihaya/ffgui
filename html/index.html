<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>FFGui - 音视频工具箱</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 功能导航首页 -->
  <main id="home-view" class="view">
    <header class="hero">
      <h1>音视频工具箱</h1>
      <p class="subtitle">选择下方功能开始处理你的音视频文件</p>
    </header>

    <section class="card-grid">
      <button class="feature-card" data-feature="convert">
        <span class="card-icon icon-convert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h13l-3-3" />
            <path d="M20 17H7l3 3" />
            <rect x="3" y="10" width="18" height="4" rx="1" />
          </svg>
        </span>
        <span class="card-title">音视频转码</span>
        <span class="card-desc">在 MP4 / MKV / MP3 等格式之间互相转换</span>
      </button>

      <button class="feature-card" data-feature="merge">
        <span class="card-icon icon-merge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6H4v12h4" />
            <path d="M16 6h4v12h-4" />
            <path d="M8 12h8" />
            <path d="M12 9v6" />
          </svg>
        </span>
        <span class="card-title">音视频合并</span>
        <span class="card-desc">将多个音视频片段拼接为一个文件</span>
      </button>

      <button class="feature-card" data-feature="clip">
        <span class="card-icon icon-clip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.5" />
            <circle cx="6" cy="18" r="2.5" />
            <path d="M8 7.5 20 19" />
            <path d="M8 16.5 20 5" />
          </svg>
        </span>
        <span class="card-title">音视频截取</span>
        <span class="card-desc">按时间段裁剪出需要的音视频部分</span>
      </button>
    </section>

    <footer class="footer">
      <span>Powered by FFmpeg</span>
      <button id="btn-clear-cache" class="btn-clear-cache" type="button"
              title="删除 ffmpeg 能力探测缓存（硬件加速 / 编码器），下次进入转码页时重新检测">
        清除硬件信息缓存
      </button>
    </footer>
  </main>

  <!-- 功能页占位（后续替换为真正的功能页面） -->
  <main id="feature-view" class="view hidden">
    <header class="feature-header">
      <button id="btn-back" class="btn-back" type="button">← 返回首页</button>
      <h2 id="feature-title"></h2>
    </header>
    <section class="feature-placeholder">
      <p>「<span id="feature-name"></span>」功能开发中，敬请期待。</p>
    </section>
  </main>

  <script src="js/index.js"></script>
</body>
</html>
